name: Backblaze B2 to Encrypted GitHub Mirror

on:
  workflow_dispatch:
    inputs:
      vault_id:
        description: 'Target B2 Vault (select: all, 01, 02, 03, 04, 05, 06, 07, 08, 09, 10)'
        required: true
        default: 'all'
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC

permissions:
  contents: write

jobs:
  mirror-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install cryptography

      - name: Run Cloud-to-Cloud Mirror Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MMS_MASTER_KEY: ${{ secrets.MMS_MASTER_KEY }}
          TARGET_VAULT_ID: ${{ github.event.inputs.vault_id || 'all' }}
        run: |
          python b2_to_github_mirror.py
